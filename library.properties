sentence=Small speech-to-text for microcontrollers, split into Speech-to-Phonemes and Phonemes-to-Text.
paragraph=Header-only C++ speech recognition: log-mel features (arduino-audio-tools FFT), a small streaming CTC phoneme model with hand-written inference, and a lexicon/LM constrained CTC beam search decoder. The two stages communicate through a lock-free SPSC queue and can run on different tasks or devices.
